
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: express-sticky
  namespace: sticky-sessions
spec:
  template:
    metadata:
      name: express-sticky-v99
      annotations:
        autoscaling.knative.dev/minScale: "0"
    spec:
      containers:
        - image: willsenabr/express-sticky:v99
          command: ["npm", "start"]
          ports:
            - containerPort: 3000
              protocol: TCP
  traffic:
    - revisionName: express-sticky-v1
      tag: v1
      percent: 34
    - revisionName: express-sticky-v2
      tag: v2
      percent: 33
    - revisionName: express-sticky-v99
      tag: v99
      percent: 33
